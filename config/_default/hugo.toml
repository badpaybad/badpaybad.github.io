baseURL = "https://badpaybad.github.io/"
defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = false
theme = "blowfish"

[pagination]
  pagerSize = 10

[params]
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  mainSections = ["posts", "pc-ai-agentic", "sharing"]

[params.author]
  name = "Nguyễn Phan Du"
  image = "https://avatars.githubusercontent.com/u/6204507?v=4"
  headline = "Software Architect | AI Agentic Specialist | Foundation & Infra Engineer"
  bio = "Founder ToT Tech Ecosystem (fossagentic.men) — Senior Software Architect chuyên sâu về Foundation Infra (.NET 10, Angular, Flutter), Kho UHF RFID (tot-hub), AI Sales Agent, ESP32-OS, C/C++ FFI và PC AI Agentic Workforce."
  links = [
    { globe = "https://fossagentic.men/" },
    { github = "https://github.com/badpaybad" },
    { email = "badpaybad@gmail.com" },
    { x-twitter = "https://twitter.com/badpaybad" },
    { facebook = "https://facebook.com/badpaybad" },
    { telegram = "https://t.me/badpaybad" },
    { paypal = "https://www.paypal.com/paypalme/dunp211284" }
  ]

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true

[article]
  showDate = true
  showAuthor = true
  showHero = true
  heroStyle = "background"
  showReadingTime = true
  showTableOfContents = true
  showPagination = true

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showAppearanceSwitcher = true

